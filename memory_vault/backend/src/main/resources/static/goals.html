<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Vault — Goals & Processes</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .goal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      transition: var(--transition);
    }
    .goal-card:hover {
      border-color: var(--border-light);
    }
    .progress-bar-wrap {
      width: 100%;
      height: 8px;
      background: var(--bg-secondary);
      border-radius: 9999px;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--secondary));
      border-radius: 9999px;
      transition: width 0.4s ease;
    }
    .process-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      margin-top: 0.4rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="main-content">
      <div class="page-content">

        <!-- Header -->
        <div class="page-header">
          <div>
            <h1 class="page-title">🎯 Goals & Processes</h1>
            <p class="page-subtitle">Define long-term aspirations and break them down into actionable steps.</p>
          </div>
          <button class="btn btn-primary" id="open-new-goal-btn">+ Create Goal</button>
        </div>

        <!-- Goals Container -->
        <div id="goals-container">
          <div class="card skeleton" style="height: 140px; margin-bottom: 1rem;"></div>
          <div class="card skeleton" style="height: 140px;"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Goal Modal (Create / Edit) -->
  <div class="modal-overlay" id="goal-modal">
    <div class="modal" style="max-width: 550px;">
      <div class="modal-header">
        <h3 class="modal-title" id="goal-modal-title">New Goal</h3>
        <button class="btn btn-ghost btn-sm" id="close-goal-modal-btn">✕</button>
      </div>
      <div class="modal-body">
        <form id="goal-form">
          <input type="hidden" id="goal-id" value="" />

          <div class="form-group">
            <label class="form-label" for="goal-title">Goal Title *</label>
            <input type="text" id="goal-title" placeholder="Learn Spanish, Run marathon, Master System Design..." required />
          </div>

          <div class="form-group">
            <label class="form-label" for="goal-desc">Description & Motivation</label>
            <textarea id="goal-desc" rows="3" placeholder="Why is this goal important to you?"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="goal-status">Status</label>
              <select id="goal-status">
                <option value="ACTIVE">Active</option>
                <option value="PAUSED">Paused</option>
                <option value="COMPLETED">Completed</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="goal-progress">Progress (%)</label>
              <input type="number" id="goal-progress" min="0" max="100" value="0" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="goal-start-date">Start Date</label>
              <input type="date" id="goal-start-date" />
            </div>
            <div class="form-group">
              <label class="form-label" for="goal-target-date">Target Date</label>
              <input type="date" id="goal-target-date" />
            </div>
          </div>

          <div id="goal-error-msg" class="form-error hidden" style="margin-bottom:0.75rem;"></div>

          <div class="modal-footer" style="padding:0; margin-top:1rem;">
            <button type="button" class="btn btn-secondary" id="cancel-goal-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-goal-btn">Save Goal</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Add Process Modal -->
  <div class="modal-overlay" id="process-modal">
    <div class="modal" style="max-width: 450px;">
      <div class="modal-header">
        <h3 class="modal-title">Add Process Step</h3>
        <button class="btn btn-ghost btn-sm" id="close-process-modal-btn">✕</button>
      </div>
      <div class="modal-body">
        <form id="process-form">
          <input type="hidden" id="process-goal-id" value="" />

          <div class="form-group">
            <label class="form-label" for="process-title">Step Title *</label>
            <input type="text" id="process-title" placeholder="Complete module 1, practice daily..." required />
          </div>

          <div class="form-group">
            <label class="form-label" for="process-progress">Progress (%)</label>
            <input type="number" id="process-progress" min="0" max="100" value="0" />
          </div>

          <div class="modal-footer" style="padding:0; margin-top:1rem;">
            <button type="button" class="btn btn-secondary" id="cancel-process-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-process-btn">Save Step</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Log Progress Modal -->
  <div class="modal-overlay" id="log-modal">
    <div class="modal" style="max-width: 450px;">
      <div class="modal-header">
        <h3 class="modal-title">Log Daily Progress</h3>
        <button class="btn btn-ghost btn-sm" id="close-log-modal-btn">✕</button>
      </div>
      <div class="modal-body">
        <form id="log-form">
          <input type="hidden" id="log-goal-id" value="" />

          <div class="form-group">
            <label class="form-label" for="log-date">Date</label>
            <input type="date" id="log-date" required />
          </div>

          <div class="form-group">
            <label class="form-label" for="log-progress-val">Progress Milestone (%)</label>
            <input type="number" id="log-progress-val" min="0" max="100" />
          </div>

          <div class="form-group">
            <label class="form-label" for="log-note">Progress Note</label>
            <textarea id="log-note" rows="3" placeholder="What did you achieve today towards this goal?"></textarea>
          </div>

          <div class="modal-footer" style="padding:0; margin-top:1rem;">
            <button type="button" class="btn btn-secondary" id="cancel-log-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-log-btn">Record Progress</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/goals.js"></script>
</body>
</html>
