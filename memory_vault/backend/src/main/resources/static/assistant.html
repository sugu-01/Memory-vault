<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Vault — AI Assistant</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--topbar-height) - 4rem);
      max-width: 900px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .chat-bubble {
      max-width: 80%;
      padding: 0.85rem 1.15rem;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .chat-bubble.assistant {
      align-self: flex-start;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text-primary);
    }
    .chat-bubble.user {
      align-self: flex-end;
      background: var(--accent);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 0.5rem;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typing 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    .quick-prompts {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem 1.5rem;
      overflow-x: auto;
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,0.15);
    }
    .quick-prompt-btn {
      white-space: nowrap;
      padding: 0.35rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    .quick-prompt-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }
    .chat-input-bar {
      display: flex;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="main-content">
      <div class="page-content">

        <div class="chat-container">
          <!-- Chat messages scroll area -->
          <div class="chat-messages" id="chat-messages">
            <div class="chat-bubble assistant">
              👋 Hello! I am your <strong>Memory Vault AI Assistant</strong>. I'm here to help you reflect on your memories, organize your pending tasks, and keep your life goals on track. How can I help you today?
            </div>
          </div>

          <!-- Quick prompts suggestions -->
          <div class="quick-prompts">
            <button class="quick-prompt-btn" data-text="Summarize my recent memories and emotional state.">✨ Summarize recent memories</button>
            <button class="quick-prompt-btn" data-text="What pending tasks should I focus on today?">✅ Review pending tasks</button>
            <button class="quick-prompt-btn" data-text="Give me encouragement and advice based on my goals.">🎯 Goal check & advice</button>
          </div>

          <!-- Input bar -->
          <form class="chat-input-bar" id="chat-form">
            <input type="text" id="chat-input" placeholder="Ask your assistant anything..." autocomplete="off" required />
            <button type="submit" class="btn btn-primary" id="send-chat-btn">Send</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/assistant.js"></script>
</body>
</html>
