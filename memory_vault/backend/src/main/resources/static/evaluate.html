<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Vault — Self-Evaluation</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .eval-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .eval-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: var(--transition);
    }
    .score-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent-dim);
      color: var(--accent-light);
      font-weight: 700;
      font-size: 1.1rem;
      border: 1px solid var(--accent);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="main-content">
      <div class="page-content">

        <!-- Header -->
        <div class="page-header">
          <div>
            <h1 class="page-title">📊 Self-Evaluation & Reflection</h1>
            <p class="page-subtitle">Review your progress over daily, weekly, and monthly periods.</p>
          </div>
          <button class="btn btn-primary" id="open-new-eval-btn">+ New Evaluation</button>
        </div>

        <!-- Period Tabs -->
        <div class="eval-tabs">
          <button class="btn btn-secondary btn-sm eval-period-btn active" data-period="">All Periods</button>
          <button class="btn btn-secondary btn-sm eval-period-btn" data-period="DAILY">Daily</button>
          <button class="btn btn-secondary btn-sm eval-period-btn" data-period="WEEKLY">Weekly</button>
          <button class="btn btn-secondary btn-sm eval-period-btn" data-period="MONTHLY">Monthly</button>
        </div>

        <!-- Evaluations List -->
        <div id="evaluations-container">
          <div class="card skeleton" style="height: 120px; margin-bottom: 1rem;"></div>
          <div class="card skeleton" style="height: 120px;"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Evaluation Modal -->
  <div class="modal-overlay" id="eval-modal">
    <div class="modal" style="max-width: 600px;">
      <div class="modal-header">
        <h3 class="modal-title" id="eval-modal-title">New Evaluation</h3>
        <button class="btn btn-ghost btn-sm" id="close-eval-modal-btn">✕</button>
      </div>
      <div class="modal-body">
        <form id="eval-form">
          <input type="hidden" id="eval-id" value="" />

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="eval-period-type">Evaluation Period *</label>
              <select id="eval-period-type" required>
                <option value="DAILY">Daily Reflection</option>
                <option value="WEEKLY">Weekly Review</option>
                <option value="MONTHLY">Monthly Assessment</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Score (1 to 10): <span id="score-display" style="font-weight:700; color:var(--accent-light);">8</span>/10</label>
              <input type="range" id="eval-score" min="1" max="10" value="8" style="padding:0; margin-top:0.5rem; cursor:pointer;" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="eval-period-start">Start Date *</label>
              <input type="date" id="eval-period-start" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="eval-period-end">End Date *</label>
              <input type="date" id="eval-period-end" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="eval-summary">Summary *</label>
            <textarea id="eval-summary" rows="3" placeholder="How did this period go overall?" required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="eval-achievements">Key Achievements</label>
            <textarea id="eval-achievements" rows="2" placeholder="What milestones or positive habits did you achieve?"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="eval-improvements">Areas for Growth / Next Focus</label>
            <textarea id="eval-improvements" rows="2" placeholder="What could be improved next time?"></textarea>
          </div>

          <div id="eval-error-msg" class="form-error hidden" style="margin-bottom:0.75rem;"></div>

          <div class="modal-footer" style="padding:0; margin-top:1rem;">
            <button type="button" class="btn btn-secondary" id="cancel-eval-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="save-eval-btn">Save Evaluation</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/evaluate.js"></script>
</body>
</html>
