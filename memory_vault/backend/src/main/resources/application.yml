spring:
  datasource:
    url: jdbc:mysql://localhost:3306/memory_vault?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

app:
  jwt:
    secret: "${JWT_SECRET:memory-vault-super-secret-key-change-in-production-must-be-at-least-256-bits}"
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  gemini:
    api-key: "${GEMINI_API_KEY:}"
    api-url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent"

logging:
  level:
    com.memoryvault: INFO
    org.flywaydb: INFO
